<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>とやま防災めぐり スクリーンショット</title>
<style>
  :root{--bg:#eef3f4;--ink:#16323b;--muted:#5b7179;--card:#ffffff;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1b20;--ink:#e6f0f2;--muted:#9db3ba;--card:#172830;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;
    padding:24px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
  .wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  h1{font-size:22px;margin:0}
  .shots{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:760px){.shots{grid-template-columns:minmax(0,1fr)}}
  figure{margin:0;display:flex;flex-direction:column;gap:8px}
  figure img{width:100%;height:auto;border-radius:12px;box-shadow:0 4px 16px rgb(0 0 0 / .15);background:var(--card)}
  figcaption{font-size:14px;color:var(--muted);font-weight:700}
  .phone img{max-width:360px;margin:0 auto;border-radius:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1>とやま防災めぐり スクリーンショット</h1>
  <div class="shots">
    <figure><figcaption>PC版</figcaption><img src="images/pc.jpg" alt="とやま防災めぐり PC版の画面。ハザードマップ上に防災ポイントと避難場所、現在地のキャラクターが表示されている" width="2880" height="1800"></figure>
    <figure class="phone"><figcaption>スマホ版</figcaption><img src="images/phone.jpg" alt="とやま防災めぐり スマホ版の画面" width="1170" height="1992"></figure>
  </div>
</div>
<script>
// 以前このURLでアプリを開いたことがある端末に残っている、古いアプリの保存データを片づける
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
